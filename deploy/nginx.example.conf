# Replace the domain and certificate paths after checking the existing server.
# Install as a NEW server block; do not replace the server's entire nginx.conf.
server {
    listen 80;
    server_name knowledge.example.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name knowledge.example.com;
    ssl_certificate /etc/letsencrypt/live/knowledge.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/knowledge.example.com/privkey.pem;
    client_max_body_size 400k;
    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_read_timeout 130s;
        proxy_send_timeout 130s;
    }
}
