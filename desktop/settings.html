<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'">
<title>连接你的 AI Tree</title>
<style>
  :root{--ink:#263e34;--muted:#84957b;--line:#dfe6d2;--green:#41654b}
  body{margin:0;padding:26px 28px;font:13px/1.7 "Segoe UI","Microsoft YaHei",sans-serif;color:var(--ink);background:#fbfcf7}
  h1{font-size:17px;font-weight:600;margin:0 0 6px}
  p{font-size:12px;color:var(--muted);margin:0 0 18px;line-height:1.8}
  label{display:block;font-size:11px;color:#7d9070;margin-bottom:7px}
  input{width:100%;box-sizing:border-box;padding:10px 11px;font-size:13px;border:1px solid var(--line);border-radius:5px;background:#fff;color:var(--ink)}
  input:focus{outline:2px solid #96af77;outline-offset:1px}
  .hint{font-size:11px;color:#9aa98a;margin-top:9px;line-height:1.8}
  .row{display:flex;gap:9px;align-items:center;margin-top:20px}
  button{padding:9px 14px;font-size:12px;border-radius:5px;border:1px solid #365b40;background:var(--green);color:#eff4e4;cursor:pointer}
  button.secondary{background:#f2f6e9;border-color:var(--line);color:#6c8259}
  button:disabled{opacity:.55;cursor:default}
  #error{margin-top:12px;font-size:11px;color:#b3785f;min-height:16px}
  code{font:11px ui-monospace,Consolas,monospace;color:#7d9070;word-break:break-all}
</style>
</head>
<body>
  <h1>AI Tree 数据位置</h1>
  <p>默认使用<b>本机数据</b>：内置服务只监听 127.0.0.1，数据保存在你电脑上的用户数据目录，不联网也能用。</p>

  <div class="row">
    <button id="useLocal">使用本机数据（默认）</button>
  </div>
  <div class="hint">当前模式：<code id="mode">读取中</code></div>

  <label for="url" style="margin-top:22px">改用云服务器（可选）</label>
  <input id="url" type="text" placeholder="https://你的域名" autocomplete="off" spellcheck="false">
  <div class="hint">必须是 https:// 的完整地址；只有本机回环（127.0.0.1 / localhost）允许 http://。<br>注意：云账号绑定与双向同步<b>尚未实现</b>，当前版本连到云服务器只加载页面，不自动上传资料。</div>

  <div class="row">
    <button id="save">保存并打开</button>
    <button id="cancel" class="secondary">稍后再说</button>
  </div>
  <div id="error"></div>
  <div class="hint">配置保存在 <code id="where"></code></div>

<script src="./settings.js"></script>
</body>
</html>
